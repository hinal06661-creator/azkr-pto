openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crypto/news:
    get:
      operationId: listCryptoNews
      tags: [crypto]
      summary: List recent crypto news from trusted publishers
      responses:
        "200":
          description: Recent news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CryptoNewsStory"
        "502":
          description: News feeds are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CryptoNewsStory:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
        source:
          type: string
        publishedAt:
          type: string
      required:
        - id
        - title
        - summary
        - url
        - source
        - publishedAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

