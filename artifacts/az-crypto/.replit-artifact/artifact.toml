kind = "mobile"
previewPath = "/"
title = "AZ Crypto"
description = "Azerbaycan piyasasına göre canlı kripto fiyatlarını, AZN dönüşümlerini, grafikleri, haberleri, favorileri ve fiyat alarmlarını sunan çok dilli mobil takip uygulaması."
version = "1.0.0"
id = "artifacts/az-crypto"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25287

[services.development]
run = "pnpm --filter @workspace/az-crypto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/az-crypto", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/az-crypto", "run", "serve" ]

[services.env]
PORT = "25287"
BASE_PATH = "/"
